services:
  postgres:
    image: docker.io/library/postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
    - ./.env:/.env
    - ./backend/app/config/serviceAccountKey.json:/app/backend/app/config/serviceAccountKey.json
    environment:
      HTTP_PORT: 8080
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DATABASE_NAME: ${DB_NAME}
      MCP1_HOST: mcp-server
      MCP1_PORT: 9000
      MCP2_HOST: mcp-server
      MCP2_PORT: 9000                                                         
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started
  mcp-server:
    build:
      context: .
      dockerfile: mcp_servers/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 9000
      MCP_PATH: /mcp
      BACKEND_BASE_URL: http://backend:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
    ports:
      - "${MCP_PORT:-9000}:9000"

volumes:
  postgres_data:
